<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>关于我 - 伊蕾娜</title>
    <!-- 外链公共样式：和首页共用同一个 style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== 导航栏（和首页一样） ===== -->
    <nav>
        <div class="nav-inner">
            <span class="logo">✨ 伊蕾娜</span>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="about.html">关于我</a>
            </div>
        </div>
    </nav>

    <main>
        <h1>关于我</h1>
        <p class="subtitle">「这位美得连太阳都眯起眼睛的美少女是谁呢？——没错，就是我！」</p>

        <!-- ===== 兴趣爱好卡片（贴合原作人设） ===== -->
        <div class="hobby-grid">
            <div class="hobby-card" data-message="🧙‍♀️ 我的旅程还在继续，下一个国家会是什么样呢？">
                <span class="emoji">🧙‍♀️</span>
                <h3>环游世界</h3>
                <p>灰之魔女的旅途</p>
            </div>
            <div class="hobby-card" data-message="🥐 牛角面包是生命之光！">
                <span class="emoji">🥐</span>
                <h3>吃面包</h3>
                <p>牛角面包赛高</p>
            </div>
            <div class="hobby-card" data-message="💰 旅费当然要精打细算…才怪，看到好玩的就忍不住了。">
                <span class="emoji">💰</span>
                <h3>赚旅费</h3>
                <p>财迷属性全开</p>
            </div>
            <div class="hobby-card" data-message="🍄 蘑菇什么的，最讨厌了！">
                <span class="emoji">🍄</span>
                <h3>讨厌蘑菇</h3>
                <p>绝对不吃菇类</p>
            </div>
        </div>

        <!-- ===== 提示文字（JS 会改这里） ===== -->
        <p id="hobbyMsg" style="margin-top: 32px; font-size: 18px; color: var(--accent-color);">
            （点卡片试试！）
        </p>
    </main>

    <footer>© 2026 伊蕾娜 · 用 HTML + CSS + JS 亲手制作</footer>

    <script>
        // ===== 点卡片弹出爱好提示 =====
        // 1. 找到所有 .hobby-card 卡片
        let cards = document.querySelectorAll(".hobby-card");

        // 2. 给每张卡片都装上点击监听
        cards.forEach(function (card) {
            card.addEventListener("click", function () {
                // 3. 读取这张卡片 data-message 里的文字，显示到页面上
                let msg = card.getAttribute("data-message");
                document.getElementById("hobbyMsg").textContent = msg;
            });
        });
    </script>
</body>
</html>
